name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x bin/*.sh bin/lib/common.sh bin/modelfit tests/*.test.sh tests/curl
      - name: Selftest
        run: ./bin/selftest.sh
      - name: Secret scan
        run: ./bin/scan-secrets.sh
